plugins {
	id 'java'
	id 'application'
	id "com.github.ben-manes.versions" version "0.47.0"
	id 'io.github.duckasteroid.agent-docs' version '1.0.11'
	id 'io.github.duckasteroid.github-packages' version '0.2.0'
	id 'org.graalvm.buildtools.native' version '1.1.12'
}

agentDocs {
	includeSources = true
}

repositories {
	mavenLocal()
	mavenCentral()
	gitHubPackages {
		owner = "duckAsteroid"
		repo = "opengl-jogl-template"
	}
}

dependencies {
	// Auto-generates META-INF/services/ entries for ServiceLoader (annotation processor only)
	compileOnly         'com.google.auto.service:auto-service-annotations:1.1.1'
	annotationProcessor 'com.google.auto.service:auto-service:1.1.1'

	// Remote control HTTP server
	implementation 'io.javalin:javalin:6.6.0'
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
	// QR code generation (nayuki, zero deps)
	implementation 'io.nayuki:qrcodegen:1.8.0'

	// Logging API
	implementation(group: 'org.slf4j', name:'slf4j-api', version: '2.0.7')
	// OpenGL utils
	implementation('io.github.duckasteroid:render-core:1.0.0-RC4')
	// LWJGL — needed for direct GL calls (render-core declares these as runtime-only)
	// Pinned to 3.3.6 (pre-3.4.0) for this native-image experiment: 3.4.x defaults to an
	// FFM-based native calling backend on JDK 25 that generates a hidden class on first
	// use, which Native Image forbids at runtime; forcing that generation to build time
	// bakes in native function pointers from the *builder* process, which segfault at
	// image runtime. 3.3.6 uses the older, native-image-proven classic JNI backend.
	// enforcedPlatform (not platform): render-core:1.0.0-RC4 itself imports the 3.4.2 BOM,
	// and Gradle's default highest-version-wins conflict resolution would otherwise pick
	// that over our 3.3.6 request.
	implementation enforcedPlatform('org.lwjgl:lwjgl-bom:3.3.6')
	implementation 'org.lwjgl:lwjgl'
	implementation 'org.lwjgl:lwjgl-opengl'
	implementation 'org.lwjgl:lwjgl-glfw'
	// JOML — vector/matrix types used in render-core API
	implementation 'org.joml:joml:1.10.9'

	// Fast Fourier Transform
	implementation 'com.github.wendykierp:JTransforms:3.1:with-dependencies'
	// Apache lang for primitive array utils
	implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.12.0'
	// INI file parsing
	implementation group: 'org.ini4j', name: 'ini4j', version: '0.5.4'
	// fractional number utils
	implementation 'org.apache.commons:commons-numbers-fraction:1.1'
	// Runtime Java compiler for animation scripts
	implementation 'org.codehaus.janino:janino:3.1.12'

	// Video overlay playback. javacv is a thin, native-free Java API; the two classified jars
	// below carry the actual native .so binaries, scoped to linux-x86_64 only (this is a
	// Linux-only personal project — do NOT use org.bytedeco:ffmpeg-platform, which pulls
	// win64/mac-x86_64/mac-arm64/linux-arm64 natives too, ~5x the download).
	implementation 'org.bytedeco:javacv:1.5.13'
	implementation 'org.bytedeco:javacpp:1.5.13:linux-x86_64'
	implementation 'org.bytedeco:ffmpeg:8.0.1-1.5.13:linux-x86_64'

	runtimeOnly 'ch.qos.logback:logback-classic:1.4.8'

	// JUnit5 for testing
	testImplementation(group: 'org.junit.jupiter', name: 'junit-jupiter', version: '5.10.0-M1')
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.mockito:mockito-core:5.23.0'
}

tasks.register('usbStickify', Copy) {
	dependsOn jar
	from "$buildDir/libs/cthuga-reborn.jar"
	into "D:\\cthuga-reborn\\lib"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// installDist/distZip/distTar (application plugin) copy all of src/dist verbatim into the
// packaged distribution. That directory is also the local run/smokeTest working directory, so
// it accumulates large or machine-local files (videos, generated tab presets, screenshots, logs,
// state) that were never meant to ship - videos alone is multiple GB and was blowing distZip/
// distTar past a usable size. Mirror .gitignore's local-only exclusions here so the packaged
// distribution stays small while `run`/`smokeTest` (which use src/dist directly, not the copy)
// keep working unchanged.
distributions {
	main {
		contents {
			exclude 'videos/**'
			exclude 'logs/**'
			exclude '*.log'
			exclude 'screenshot-*.png'
			exclude 'configs/**'
			exclude 'beatpresets/**'
			exclude 'state.ini'
			exclude 'state-*.ini'
			exclude 'tabs/Spiral/**'
			exclude 'tabs/**/*.tab'
			exclude 'maps/*.MAP.png'
		}
	}
}

compileJava {
	options.incremental = true
	options.fork = true
}

test {
	useJUnitPlatform {
		excludeTags 'smoke'
	}
}

// Launches the installed distribution, drives it via --stdin, and checks for crashes,
// blank renders, and a healthy remote API. Not part of `test`/`check` since it needs a
// real display and spawns a GLFW window - run explicitly with `./gradlew smokeTest`.
tasks.register('smokeTest', Test) {
	group = 'verification'
	description = 'Launches the installed app end-to-end and checks for startup/render/remote-API regressions.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'smoke'
	}
	dependsOn installDist
	def installDir = tasks.named('installDist', Sync).get().destinationDir
	systemProperty 'smoketest.binary', new File(installDir, "bin/${application.applicationName}").absolutePath
	systemProperty 'smoketest.workdir', "$projectDir/src/dist"
	systemProperty 'smoketest.reportdir', "$buildDir/smoke-test"
	outputs.upToDateWhen { false }
	// Same GL/display env the `run` task needs on this machine - without a correct XAUTHORITY,
	// GLFW/AWT font rasterization can silently stall rather than error out.
	environment '__NV_PRIME_RENDER_OFFLOAD', '1'
	environment '__GLX_VENDOR_LIBRARY_NAME', 'nvidia'
	environment 'XAUTHORITY', System.getenv('XAUTHORITY')
			?: fileTree('/run/user/' + System.getProperty('user.name')).find { it.name.startsWith('.mutter-Xwaylandauth') }?.absolutePath
}

application {
	applicationName = "cthugha-reborn"
	mainClass = "io.github.duckasteroid.cthugha.Main"
	//applicationDefaultJvmArgs = ['-Duser.dir=%APP_HOME%']
}

// Several dependency jars (e.g. joml, which carries a jspecify @NullMarked package
// annotation) ship package-info.class files compiled to the ancient 46.0 (Java 1.2)
// classfile version - a decades-old javac quirk for annotation-only package-info
// sources. GraalVM 25's native-image classpath scan (which loads every class,
// including package-info, to check for @Platforms/@AutomaticFeature annotations)
// throws ClassFormatError on that version. Confirmed reproducible on both Oracle
// GraalVM and GraalVM CE 25.3.4, so this is an upstream native-image bug, not
// something fixable via config. Work around it by feeding native-image a copy of
// the runtime classpath jars with package-info.class entries stripped - they carry
// no runtime behaviour, only compile-time nullability annotations.
def graalCpDir = layout.buildDirectory.dir('graalCp')
def stripPackageInfoForNativeImage = tasks.register('stripPackageInfoForNativeImage') {
	def inputFiles = configurations.runtimeClasspath
	inputs.files(inputFiles)
	outputs.dir(graalCpDir)
	doLast {
		def dir = graalCpDir.get().asFile
		project.delete(dir)
		dir.mkdirs()
		inputFiles.files.findAll { it.isFile() && it.name.endsWith('.jar') }.each { File src ->
			def dest = new File(dir, src.name)
			src.withInputStream { is ->
				new java.util.zip.ZipInputStream(is).withCloseable { zin ->
					dest.withOutputStream { os ->
						new java.util.zip.ZipOutputStream(os).withCloseable { zout ->
							byte[] buf = new byte[8192]
							def entry
							while ((entry = zin.nextEntry) != null) {
								if (entry.name.endsWith('package-info.class')) continue
								zout.putNextEntry(new java.util.zip.ZipEntry(entry.name))
								int n
								while ((n = zin.read(buf)) != -1) zout.write(buf, 0, n)
								zout.closeEntry()
							}
						}
					}
				}
			}
		}
	}
}

graalvmNative {
	metadataRepository {
		enabled = true
	}
	binaries {
		main {
			imageName = 'cthugha-reborn'
			mainClass = 'io.github.duckasteroid.cthugha.Main'
			buildArgs.add('--enable-native-access=ALL-UNNAMED')
			runtimeArgs.add('--enable-native-access=ALL-UNNAMED')
			// LWJGL is pinned to 3.3.6 (see the dependency comment above) specifically to
			// use its classic JNI native backend instead of 3.4.x's FFM-based one, so no
			// initialize-at-build-time/runtime tuning should be needed for org.lwjgl here.
			classpath.setFrom(
				fileTree(graalCpDir) { include '*.jar' }.builtBy(stripPackageInfoForNativeImage),
				sourceSets.main.output
			)
		}
	}
}

run {
	workingDir = file("src/dist")
	println "Working directory: ${workingDir}"
	systemProperty("cthugha.png.stats.enabled", "true")
	systemProperty("slf4j.internal.verbosity", "WARN")
	systemProperty("joml.nounsafe", "true")
	jvmArgs "--enable-native-access=ALL-UNNAMED"
	// Fixed remote-control token for local dev, so the same browser session/URL survives app restarts.
	args "--remote-token=THIS_IS_A_TEST"
	//systemProperty("sun.java2d.opengl", "true")
	environment '__NV_PRIME_RENDER_OFFLOAD', '1'
	environment '__GLX_VENDOR_LIBRARY_NAME', 'nvidia'
	environment 'XAUTHORITY', System.getenv('XAUTHORITY')
			?: fileTree('/run/user/' + System.getProperty('user.name')).find { it.name.startsWith('.mutter-Xwaylandauth') }?.absolutePath

	def prevAudioSource = ['']
	doFirst {
		prevAudioSource[0] = ['pactl', 'get-default-source'].execute().text.trim()
		def defaultSink = ['pactl', 'get-default-sink'].execute().text.trim()
		['pactl', 'set-default-source', "${defaultSink}.monitor"].execute().waitFor()
	}
	doLast {
		if (prevAudioSource[0]) {
			['pactl', 'set-default-source', prevAudioSource[0]].execute().waitFor()
		}
	}
}

processResources {
	dependsOn ':remote-ui:npmBuild'
	from(project(':remote-ui').file('dist')) {
		into 'remote'
	}
}

startScripts {
	doLast {
		unixScript.text = unixScript.text.replace(
			'exec "$JAVACMD" "$@"',
			'''# Parse optional --audio-source=<pactl-source-name> (default: monitor of the current default sink)
AUDIO_SOURCE=""
for _arg in "$@"; do
    case "$_arg" in
        --audio-source=*) AUDIO_SOURCE="${_arg#*=}" ;;
    esac
done
[ -z "$AUDIO_SOURCE" ] && AUDIO_SOURCE="$(pactl get-default-sink 2>/dev/null).monitor"
_PREV_SOURCE=$(pactl get-default-source 2>/dev/null)
pactl set-default-source "$AUDIO_SOURCE" 2>/dev/null
export __NV_PRIME_RENDER_OFFLOAD=1
export __GLX_VENDOR_LIBRARY_NAME=nvidia
"$JAVACMD" --enable-native-access=ALL-UNNAMED -Dslf4j.internal.verbosity=WARN -Djoml.nounsafe=true "$@"
_EXIT=$?
[ -n "$_PREV_SOURCE" ] && pactl set-default-source "$_PREV_SOURCE" 2>/dev/null
exit $_EXIT'''
		)
	}
}
