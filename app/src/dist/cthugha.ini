[display]
# Monitor to display on (0 = primary). Available monitors and their indices are
# logged at INFO level on startup — check the log to find the right value.
monitor = 0
# Initial window size — use plain pixels ("1280"), "1280px", or a % of the monitor ("30%")
# (ignored when fullscreen is on — see the Fullscreen toggle in the Settings panel, or press F.
# Its state is remembered automatically in state.ini, not here.)
width = 2000
height = 1000
# Internal render buffer size — defaults to width x height above.
# Set smaller for a retro low-res look (palette renderer upscales to fill the window).
# Supports plain pixels ("320"), "320px", or a % of the initial window size ("25%").
# Note: in-buffer quote text position is relative to the render buffer, not the window.
# render_width = 25%
# render_height = 25%
# Target frame rate in Hz — 0 (or omit) for unlimited (max throughput).
# Setting this caps the render loop so the GPU isn't pegged at 100%, which
# keeps frame pacing smoother on slower hardware. Try 60 for a stable display.
target_fps = 50

[keys]
# Key bindings — map a key combination to a node path in the parameter tree.
# Format:  KEY = Node Path/Child Name
#          MODIFIER+KEY = Node Path
# KEY is a GLFW-derived name: single letter (F, I, X …) or named key
# (PRINT_SCREEN, RIGHT_BRACKET, LEFT_BRACKET, COMMA, PERIOD …).
# Modifiers: SHIFT, CTRL, ALT, SUPER.  Multiple modifiers: SHIFT+CTRL+K.
#
# App
ESCAPE = General/Quit
#
# Display
F = General/Fullscreen
PRINT_SCREEN = General/Screenshot
CTRL+PRINT_SCREEN = General/Record 5s
P = Render/Palette/Random
I = Images/Random
X = Images/Flash White
Q = Quotes/Random
N = General/Notifications
B = Quotes/Toggle Quote Mode
D = Audio/Debug Beats
#
# Translation
T = Tab/Translate Source/Randomise
SHIFT+T = Tab/Translate Source/Random Source
RIGHT_BRACKET = Tab/Translate Source/Next
LEFT_BRACKET = Tab/Translate Source/Previous
SHIFT+S = Tab/Translate Source/Save
#
# Remote
R = General/Remote/Rotate Token

[Quotes]
# One or more JSON quote files to load (repeat the key to add more sources).
# Each file must be a JSON array of {"quote": "...", "author": "..."} objects.
# Quotes may contain \n for multi-line display.
files = quotes.json
# files = extra_quotes.json
# Font sizes: plain pixels ("36"), "36px", or "5%" of window height (capped at 120px).
quote_font = Noto Serif Display
quote_size = 10%
quote_style = ITALIC
attr_font = Noto Serif Display
attr_font = 
attr_size = 5%
attr_align = right

[Notifications]
# Notification overlay appearance.
# font:     Java logical font name (Monospaced, SansSerif, Serif …) or installed font name
# size:     plain pixels ("18"), "18px", or "2%" of window height (capped at 120px)
# style:    PLAIN | BOLD | ITALIC | BOLD_ITALIC
# color:    StandardColors name (WHITE, YELLOW, RED, GREEN, CYAN …) or hex (#RRGGBB / #RRGGBBAA)
# location: corner to anchor the message — TOP_LEFT | TOP_RIGHT | BOTTOM_LEFT | BOTTOM_RIGHT
# padding:  gap from edge — plain pixels ("20"), "20px", or "1%" of window height
# duration: how many seconds each notification stays on screen
# font     = Monospaced
size = 8%

# style    = BOLD
# color    = YELLOW
# location = TOP_LEFT
# padding  = 1%
# duration = 3
[Work]
# Background work spinner and status label appearance.
# font:     Java logical font name (Monospaced, SansSerif, Serif …) or installed font name
# size:     plain pixels ("18"), "18px", or "2%" of window height (capped at 120px)
# style:    PLAIN | BOLD | ITALIC | BOLD_ITALIC
# color:    StandardColors name (WHITE, YELLOW, RED, GREEN, CYAN …) or hex (#RRGGBB / #RRGGBBAA)
# location: corner to anchor the spinner — TOP_LEFT | TOP_RIGHT | BOTTOM_LEFT | BOTTOM_RIGHT
# padding:  gap from edge — plain pixels ("20"), "20px", or "1%" of window height
# rpm:      spinner rotation speed in revolutions per minute
# font     = Monospaced
size = 8%

# "Debug Beats" HUD overlay appearance (Audio tab toggle, or the D key).
# One row per band in [beats] above: name, a bar, and its live strength value.
# font:      Java logical font name — a monospaced one keeps the columns aligned
# size:      plain pixels ("18"), "18px", or "2%" of window height (capped at 120px)
# style:     PLAIN | BOLD | ITALIC | BOLD_ITALIC
# color:     StandardColors name (WHITE, YELLOW, RED, GREEN, CYAN …) or hex (#RRGGBB / #RRGGBBAA)
# location:  corner to anchor the panel — TOP_LEFT | TOP_RIGHT | BOTTOM_LEFT | BOTTOM_RIGHT
# padding:   gap from edge — plain pixels ("20"), "20px", or "1%" of window height
# bar_width: bar length in pixels at full strength — plain pixels or "%" of window width
# row_gap:   vertical gap between rows in pixels
# gap:       horizontal gap between name/bar/number in pixels
# font      = Monospaced
# size      = 18
# style     = BOLD
# color     = CYAN
# location  = TOP_RIGHT
# padding   = 1%
# bar_width = 160
# row_gap   = 4
# gap       = 10
[remote]
# Set to false to disable remote control server
enabled = true
# Our port based on Amiga
port = 8363
# Network interface whose IP is used in the QR URL. Use `ip addr` to find your interface name.
# Setting this trusts the named interface even if the OS marks it virtual (e.g. USB ethernet adapters).
network_interface = wlp59s0
# Logo size as % of QR area (0 = no logo, 30 = max). ECC is chosen automatically.
qr_logo_size = 10
# Set to false to hide the Screenshot/Record/Stop Recording buttons in the remote UI header.
# Local keyboard shortcuts (e.g. PRINT_SCREEN) still work either way.
screen_capture_toolbar = true
# Set to false to disable the Library Manager (rename/organize videos, images, and palettes from
# a separate browser tab, opened via the header icon in the remote UI). This only seeds the
# initial value — it can also be flipped at runtime from the app's General settings ("Library
# Manager" toggle), which then remembers its own value across restarts and takes precedence.
library_manager = true

[beats]
bass = 143-1087
snare = 928-2395
hihat = 5171-6609

# Frequency bands monitored by beat detection (bass()/snare()/hihat()/beat(name) in binding
# scripts, and the Debug Beats HUD overlay — see the "Debug Beats" toggle on the Audio tab).
# Each key is a band name, value is "fMin-fMax" in Hz. Uncomment and edit to override the
# built-in defaults below; renaming a band means any script referencing the old name via
# beat("oldname") silently returns 0 instead of erroring.
# bass  = 20-250
# snare = 250-2000
# hihat = 2000-20000
[BeatDetector]
threshold = 1.216
sensitivity = 8.2675
decay = 0.029
history = 219

# Global tuning knobs for beat detection (all also editable live via sliders on the Audio tab's
# "Beat Detector" section — dragging a slider there writes back here immediately).
# threshold:   ratio above the rolling average energy required to start triggering a beat,
#              e.g. 1.3 = 30% louder than average.
# sensitivity: scales how quickly strength above threshold reaches 1.0; higher reaches full
#              strength at a lower peak.
# decay:       per-frame fall rate of the published beat strength (assumes ~60fps); e.g. 1/60
#              causes full scale to decay to zero in one second.
# history:     number of past frames used for the rolling energy average.
# threshold   = 1.3
# sensitivity = 2.0
# decay       = 0.016667
# history     = 43
[session]
# How often the live parameter tree (waves, bindings, palette, tab generator, blur, etc.) is
# flushed to configs/.current.json so it can be restored automatically on the next launch.
# ISO-8601 duration (Duration.parse). A crash can lose at most this much of the session;
# shorter values cost more disk I/O (a write only actually happens if something changed).
current_state_interval = PT5S

