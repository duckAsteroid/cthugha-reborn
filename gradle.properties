# Points Gradle's Java toolchain resolution at the locally installed GraalVM JDK
# (installed via sdkman: `sdk install java 25.3.4-r25.graal`) so the native-image build
# tools plugin can find a native-image-capable JDK without downloading one.
# Needs a recent-enough GraalVM point release for its reachability-metadata schema
# version to match the org.graalvm.buildtools metadata repository.
org.gradle.java.installations.paths=/home/chris/.sdkman/candidates/java/25.3.4+1.r25-graalce
org.gradle.java.installations.auto-detect=false
